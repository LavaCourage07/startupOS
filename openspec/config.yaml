schema: spec-driven

context: |
  项目：OriginOS，由 Pi Agent 驱动的 AI Native 桌面操作环境。
  运行时：Node.js 24+、pnpm workspace、TypeScript strict mode。
  前端：Next.js App Router 14+、React 18+、Tailwind CSS、shadcn/ui、Zustand。
  桌面端：Electron main/preload/IPC，共享业务逻辑位于 packages/core。
  存储：仅使用本地 JSON/文件存储；MVP 阶段禁止数据库和额外后端框架。
  架构事实源：AGENTS.md。
  依赖方向：desktop/web 边界 -> core features/modules -> storage/integrations/shared/types。
  Story 规格位于 docs/specs/epic-*/story-*，用于定义产品需求和验收测试。
  OpenSpec Proposal 是实施边界。每个可独立交付的 Story Task 必须且只能对应一个 Proposal。
  Proposal 应用源码由 subagent 在隔离的 Task branch/worktree 中实施，合并到 Proposal integration branch，完成全部验证后再合并到 dev。
  禁止把 .next、dist-electron、node_modules、release artifacts 或 runtime data 等生成内容作为源码修改入口。
  OpenSpec artifact 正文统一使用中文。仅保留 schema 要求的固定关键字、代码标识、路径、命令、包名、协议名和无法准确翻译的专有名词。

rules:
  proposal:
    - 标题、说明、范围、影响、上线和回滚正文必须使用中文；仅保留必要关键字和技术标识。
    - 必须包含可追溯信息：epic-id、story-id、task-id、owner 和来源 Story 文档路径。
    - 每个 Proposal 只能覆盖一个可独立交付的 Story Task。
    - 必须包含动机、变更内容、非目标、影响、依赖、上线方案和回滚方案。
    - 适用时必须识别受影响的 capabilities、packages、public APIs、persistence、IPC 和 platform packaging。
    - Proposal 未通过 strict validation 并获得显式批准前，不得开始实施。
  specs:
    - 需求和场景描述必须使用中文，同时保留 parser 要求的 ADDED Requirements、Requirement、Scenario、WHEN、THEN、SHALL、MUST 等固定关键字。
    - 规范性需求必须使用 SHALL 或 MUST。
    - 每条需求必须至少包含一个具体 Scenario。
    - 适用时必须覆盖成功、失败、边界、持久化、跨进程和恢复行为。
    - capability spec 不得依赖具体实施 branch 或 worktree 的细节。
  design:
    - 所有叙述性设计内容必须使用中文；代码标识、路径、命令、包名、协议和翻译后会降低精度的专有名词可以保留。
    - 必须证明符合 AGENTS.md 的目录和依赖方向规则。
    - 适用时必须记录数据所有权、状态事实源、API 契约、并发、恢复、性能、安全、迁移和回滚。
    - 必须列出考虑过的替代方案，并说明选择当前设计的理由。
    - 必须定义允许 subagent 在互不重叠写入范围中工作的实施边界。
  tasks:
    - Task 标题、说明、依赖说明、角色、测试要求和完成证据必须使用中文。
    - 必须使用稳定 Task ID 将 Proposal 拆分为有序工作包。
    - 每个工作包必须声明依赖、写入范围、负责的 subagent 角色、必需测试和完成证据。
    - 独立工作包必须标记为可并行；有依赖或写入范围重叠的工作包必须标记为串行。
    - 应用源码变更必须在 subagent Task branch/worktree 中实施，不得在 Proposal 主 worktree 中实施。
    - 通用 openspec apply workflow 仅用于编排；实施工作必须委派到隔离的 subagent Task worktree。
    - 必须包含集成、回归、OpenSpec strict validation、Story verification goal、合并和清理任务。
    - 实施和必需证据齐全前，不得将 Task 标记为完成。
