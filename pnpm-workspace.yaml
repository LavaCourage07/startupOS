packages:
  - packages/*

# Electron 主进程产物在 dist-electron/ 下，运行时向上解析 node_modules；
# pnpm 默认 isolated 模式不 hoist，导致 zod 等依赖解析失败。
# hoisted 模式平铺依赖，解决 Electron + monorepo 运行期解析问题。
nodeLinker: hoisted

# 强制把 @anthropic-ai/sdk hoist 到顶层 node_modules，
# 这样 electron-builder 打包时能扫描到它并正确收集到 app.asar 中。
# 原因：@anthropic-ai/sdk 是 @mariozechner/pi-ai 的 peer dependency，
# pnpm 默认不会 hoist peer dep，导致打包后 app.asar 缺失该模块。
publicHoistPattern:
  - '@anthropic-ai/sdk'
  - 'electron-updater'
  - 'electron-log'
  - 'js-yaml'
  - 'argparse'

# 只安装当前平台架构的 optional 二进制（@next/swc-* 等），
# 避免拉取 linux/win32 跨平台包导致 npmmirror 下载失败卡住。
supportedArchitectures:
  os:
    - darwin
  cpu:
    - arm64
    - x64

allowBuilds:
  '@google/genai': true
  '@parcel/watcher': true
  canvas: true
  electron-winstaller: true
  esbuild: true
  koffi: true
  onnxruntime-node: true
  protobufjs: true
