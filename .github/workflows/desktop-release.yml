name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload artifacts to Qiniu and update the website release metadata
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      resume_existing:
        description: Skip immutable artifacts that already exist on Qiniu
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    tags:
      - "desktop-v*"

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "9.15.9"
  ONNXRUNTIME_NODE_INSTALL: "skip"

jobs:
  windows:
    name: Build Windows
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        env:
          npm_config_onnxruntime_node_install: skip

      - run: pnpm --filter @originos/desktop build:app

      - name: Build Windows packages
        working-directory: packages/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm exec electron-builder --config electron-builder.yml --win --publish never

      - run: pnpm --filter @originos/desktop verify:win-package

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          if-no-files-found: error
          path: |
            release/OriginOS CE-*-x64.exe
            release/OriginOS CE-*-x64.zip
            release/OriginOS CE-*-x64.exe.blockmap
            release/OriginOS CE-*-x64.zip.blockmap
            release/latest-win.yml
            release/stable-win.yml
            release/latest.yml
            release/stable.yml

  macos-arm64:
    name: Build macOS arm64
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        env:
          npm_config_onnxruntime_node_install: skip

      - run: pnpm --filter @originos/desktop build:app

      - name: Verify macOS signing secrets
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          test -n "$MAC_CSC_LINK"
          test -n "$MAC_CSC_KEY_PASSWORD"
          test -n "$APPLE_API_KEY_CONTENT"
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_ISSUER"

      - name: Prepare Apple API key file
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          key_file="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          if printf '%s' "$APPLE_API_KEY_CONTENT" | grep -q -- '-----BEGIN PRIVATE KEY-----'; then
            printf '%s' "$APPLE_API_KEY_CONTENT" | sed 's/\\n/\n/g' > "$key_file"
          elif printf '%s' "$APPLE_API_KEY_CONTENT" | base64 --decode > "$key_file" 2>/dev/null; then
            grep -q -- '-----BEGIN PRIVATE KEY-----' "$key_file"
          else
            echo "APPLE_API_KEY must contain the .p8 private key content or its base64 encoding." >&2
            exit 1
          fi
          printf '\n' >> "$key_file"
          grep -q -- '-----END PRIVATE KEY-----' "$key_file"
          openssl ec -in "$key_file" -noout -check >/dev/null
          chmod 600 "$key_file"
          echo "APPLE_API_KEY=$key_file" >> "$GITHUB_ENV"

      - name: Verify Apple notarization credentials
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          xcrun notarytool store-credentials originos-notarytool \
            --key "$APPLE_API_KEY" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER"

      - name: Build macOS arm64 package
        working-directory: packages/desktop
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          DEBUG: "@electron/notarize*,electron-notarize*"
        run: pnpm exec electron-builder --config electron-builder.yml --mac --arm64 --publish never

      - run: pnpm --filter @originos/desktop verify:mac-signing

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-release
          if-no-files-found: error
          path: |
            release/OriginOS CE-*-arm64.dmg
            release/OriginOS CE-*-arm64.dmg.blockmap

  macos-x64:
    name: Build macOS x64
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        env:
          npm_config_onnxruntime_node_install: skip

      - run: pnpm --filter @originos/desktop build:app

      - name: Verify macOS signing secrets
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          test -n "$MAC_CSC_LINK"
          test -n "$MAC_CSC_KEY_PASSWORD"
          test -n "$APPLE_API_KEY_CONTENT"
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_ISSUER"

      - name: Prepare Apple API key file
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          key_file="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          if printf '%s' "$APPLE_API_KEY_CONTENT" | grep -q -- '-----BEGIN PRIVATE KEY-----'; then
            printf '%s' "$APPLE_API_KEY_CONTENT" | sed 's/\\n/\n/g' > "$key_file"
          elif printf '%s' "$APPLE_API_KEY_CONTENT" | base64 --decode > "$key_file" 2>/dev/null; then
            grep -q -- '-----BEGIN PRIVATE KEY-----' "$key_file"
          else
            echo "APPLE_API_KEY must contain the .p8 private key content or its base64 encoding." >&2
            exit 1
          fi
          printf '\n' >> "$key_file"
          grep -q -- '-----END PRIVATE KEY-----' "$key_file"
          openssl ec -in "$key_file" -noout -check >/dev/null
          chmod 600 "$key_file"
          echo "APPLE_API_KEY=$key_file" >> "$GITHUB_ENV"

      - name: Verify Apple notarization credentials
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          xcrun notarytool store-credentials originos-notarytool \
            --key "$APPLE_API_KEY" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER"

      - name: Build macOS x64 package
        working-directory: packages/desktop
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          DEBUG: "@electron/notarize*,electron-notarize*"
        run: pnpm exec electron-builder --config electron-builder.yml --mac --x64 --publish never

      - run: pnpm --filter @originos/desktop verify:mac-signing

      - uses: actions/upload-artifact@v4
        with:
          name: macos-x64-release
          if-no-files-found: error
          path: |
            release/OriginOS CE-*-x64.dmg
            release/OriginOS CE-*-x64.dmg.blockmap

  publish:
    name: Publish Qiniu
    runs-on: macos-14
    needs:
      - windows
      - macos-arm64
      - macos-x64
    timeout-minutes: 60
    if: github.event_name == 'push' || inputs.publish == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        env:
          npm_config_onnxruntime_node_install: skip

      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release

      - uses: actions/download-artifact@v4
        with:
          name: macos-arm64-release
          path: release

      - uses: actions/download-artifact@v4
        with:
          name: macos-x64-release
          path: release

      - run: pnpm --filter @originos/desktop verify:release-artifacts

      - name: Verify publish secrets
        env:
          QINIU_AK: ${{ secrets.QINIU_AK }}
          QINIU_AS: ${{ secrets.QINIU_AS }}
          QINIU_BUCKET: ${{ secrets.QINIU_BUCKET }}
          ORIGINOS_UPDATE_BASE_URL: ${{ secrets.ORIGINOS_UPDATE_BASE_URL }}
          ORIGINOS_RELEASE_API_URL: ${{ secrets.ORIGINOS_RELEASE_API_URL }}
          ORIGINOS_RELEASE_API_KEY: ${{ secrets.ORIGINOS_RELEASE_API_KEY }}
        run: |
          test -n "$QINIU_AK"
          test -n "$QINIU_AS"
          test -n "$QINIU_BUCKET"
          test -n "$ORIGINOS_UPDATE_BASE_URL"
          test -n "$ORIGINOS_RELEASE_API_URL"
          test -n "$ORIGINOS_RELEASE_API_KEY"

      - name: Publish to Qiniu and website
        working-directory: packages/desktop
        env:
          QINIU_AK: ${{ secrets.QINIU_AK }}
          QINIU_AS: ${{ secrets.QINIU_AS }}
          QINIU_BUCKET: ${{ secrets.QINIU_BUCKET }}
          QINIU_PREFIX: ${{ secrets.QINIU_PREFIX }}
          QINIU_REGION: ${{ secrets.QINIU_REGION }}
          QINIU_RESUME_EXISTING: ${{ inputs.resume_existing == 'true' && '1' || '0' }}
          QINIU_SKIP_LOCAL_PACKAGE_VERIFY: "1"
          ORIGINOS_UPDATE_BASE_URL: ${{ secrets.ORIGINOS_UPDATE_BASE_URL }}
          ORIGINOS_RELEASE_API_URL: ${{ secrets.ORIGINOS_RELEASE_API_URL }}
          ORIGINOS_RELEASE_API_KEY: ${{ secrets.ORIGINOS_RELEASE_API_KEY }}
        run: pnpm publish:qiniu
