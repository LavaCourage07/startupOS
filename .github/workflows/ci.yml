name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm type-check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm --filter @originos/pi-agent-adapter test
      - run: pnpm --filter @originos/desktop test
      - name: Pi runtime contract regression
        working-directory: packages/core
        run: >-
          pnpm exec vitest run --config vitest.config.ts
          src/lib/integrations/pi-agent/core/__tests__/agent.test.ts
          src/lib/integrations/pi-agent/core/__tests__/completion-guard.test.ts
          src/lib/integrations/pi-agent/core/__tests__/completion-judge.test.ts
          src/lib/integrations/pi-agent/__tests__/agent-manager.test.ts
          src/lib/integrations/pi-agent/__tests__/session-store.test.ts
          src/lib/integrations/pi-agent/tools/__tests__/registry.test.ts
          src/lib/integrations/pi-agent/tools/__tests__/tool-execution.test.ts
          src/lib/integrations/pi-agent/role-agent/__tests__/index.test.ts
          src/lib/integrations/pi-agent/project-agent/__tests__/collaboration-prompt.test.ts

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
